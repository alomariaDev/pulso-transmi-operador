name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  # Actívalo tras verificar la ejecución manual y la detección de ciclos.
  # GitHub usa UTC; la API, no el cron, decide cuál ciclo está abierto.
  # schedule:
  #   - cron: "7,22,37,52 * * * *"

concurrency:
  group: pulso-transmi-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Consultar ciclo, ingerir, decidir modelo y enviar
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.pipeline
