name: pulso-transmi-dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

concurrency:
  group: pulso-transmi-dashboard
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard data dependencies
        run: python -m pip install -e .

      - name: Build public dashboard snapshot
        run: python dashboard/build_data.py

      - name: Update dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/summary_data.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot did not change."
            exit 0
          fi
          git commit -m "chore(dashboard): refresh public snapshot [skip ci]"
          git push
