name: pulso-transmi-collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e "."

      - name: Collect API data into Supabase PostgreSQL
        run: python -m pulso_transmi.collector
