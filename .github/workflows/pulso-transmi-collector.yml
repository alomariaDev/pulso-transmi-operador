name: pulso-transmi-collector

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions no admite intervalos de 2 minutos; 5 minutos es el mínimo práctico.
    - cron: "*/5 * * * *"

concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e "."

      - name: Collect API data into Supabase PostgreSQL
        id: collect
        run: |
          set -o pipefail
          python -m pulso_transmi.collector 2>&1 | tee collector.log

      - name: Publish collector log summary
        if: always()
        run: |
          {
            echo "## Collector run"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- UTC: \`${date -u +%Y-%m-%dT%H:%M:%SZ}\`"
            echo
            echo '```text'
            cat collector.log 2>/dev/null || echo 'No se generó log del colector.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload collector log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-log-${{ github.run_id }}
          path: collector.log
          if-no-files-found: ignore
          retention-days: 7
