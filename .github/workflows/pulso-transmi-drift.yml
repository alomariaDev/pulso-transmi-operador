name: pulso-transmi-drift

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

concurrency:
  group: pulso-transmi-drift
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[ml]"

      - name: Detect drift
        id: drift
        run: |
          set -o pipefail
          python examples/07_drift_monitor.py 2>&1 | tee drift.log

      - name: Retrain after drift
        if: steps.drift.outputs.drift_detected == 'true'
        run: python examples/04_train_extra_trees.py

      - name: Publish drift summary
        if: always()
        run: |
          {
            echo "## Drift monitor"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```json'
            cat artifacts/drift_report.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: |
            artifacts/drift_report.json
            drift.log
            artifacts/extra_trees_demand.joblib
          if-no-files-found: ignore
          retention-days: 14
